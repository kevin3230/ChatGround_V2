<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
<meta charset="UTF-8">
<meta name="_csrf" th:content="${_csrf.token}"/>
<!--	default header name is X-CSRF-TOKEN-->
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<title>ChatGround</title>
<link rel="stylesheet" th:href="@{/utility/css/bootstrap.min.css}" href="../utility/css/bootstrap.min.css">
<link rel="stylesheet" type="text/css" th:href="@{/css/NavBar.css}" href="../css/NavBar.css">
<link rel="stylesheet" th:href="@{/css/MembersSignUp.css}" href="../css/MembersSignUp.css">
</head>
<body>
	<div th:replace="~{index/NavBar :: navBar}"></div>
	<div class="container">
		<div class="row justify-content-center">
			
			<div class="col-5">
				<div class="col-12" th:text="#{members.signup}">
				</div>
				<div class="col-12">
					<div th:if="${errorMessages != null}" id="errorMessages" class="warn">
						<span th:text="#{error.message} + ':'"></span>
						<div th:each="error: ${errorMessages}">
							<li th:text="${error}"></li>
						</div>
					</div>
					<form th:action="@{/member/signup}" th:object="${member}" method="post" id="signUp" enctype="multipart/form-data">
						<table class="col-12">
							<thead class="center">
								<tr>
									<th><span style="color: red" th:text="'*' + #{necessary.field}"></span></th>
								</tr>
							</thead>
							<tbody class="center">
								<tr>
									<th><label class="xrequired" th:text="#{account}"></label></th>
									<td>
										<input type="text" name="account" id="account" required="required" th:field="*{account}">
										<p id="account_hint"></p>
										<span class="warn" th:if="${#fields.hasErrors('account')}" th:errors="*{account}"></span>
									</td>
								</tr>
								<tr>
									<th><label class="xrequired" th:text="#{password}"></label></th>
									<td><input type="password" name="password" id="pwd1" required="required"></td>
								</tr>
								<tr>
									<th><label class="xrequired" th:text="#{confirm.password}"></label></th>
									<td>
										<input type="password" id="pwd2" required="required">
										<p id="pwd_hint"></p>
									</td>
								</tr>
								<tr>
									<th><label class="xrequired" th:text="#{nickname}"></label></th>
									<td>
										<input type="text" name="nickName" required="required" th:field="*{nickName}">
										<span class="warn" th:if="${#fields.hasErrors('nickName')}" th:errors="*{nickName}"></span>
									</td>
								</tr>
								<tr>
									<th><label class="xrequired" th:text="#{email}"></label></th>
									<td>
										<input type="email" name="email" id="email" required="required" th:field="*{email}">
										<p id="email_hint"></p>
										<span class="warn" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
									</td>
								</tr>
								<tr>
									<th><label class="xrequired" th:text="#{birth}"></label></th>
									<td><input type="date" name="birth"id="birth" required="required" th:value="${member.birth}"></td>
								</tr>
								<tr>
									<th><label class="xrequired" th:text="#{gender}"></label></th>
									<td>
										<input type="radio" name="gender" value="男" id="gendermale" required="required"><label for="gendermale" th:text="#{gender.male}"></label>
										<input type="radio" name="gender" value="女" id="genderfemale" required="required"><label for="genderfemale" th:text="#{gender.female}"></label>
										<input type="radio" name="gender" value="X" id="genderX" required="required"><label for="genderX" th:text="#{gender.x}"></label>
									</td>
								</tr>
								<tr>
									<th><span th:text="#{profile.picture}"></span></th>
									<td><input type="file" name="mem_pic" id="mem_pic" accept="image/png, image/jpeg" th:value="${member.picture }"></td>
								</tr>
							</tbody>
						</table>
					</form>
					<div class="col-12" id="previewMem_pic" ></div>
				</div>
				<div class="row justify-content-center">
					<button type="submit" form="signUp" id="submitBtn" th:text="#{signup}"></button>
				</div>
			</div>
		</div>
	</div>
	<script th:src="@{/utility/js/jquery-3.5.1.min.js}" src="../utility/js/jquery-3.5.1.min.js"></script>
    <script th:src="@{/utility/js/popper.min.js}" src="../utility/js/popper.min.js"></script>
    <script th:src="@{/utility/js/bootstrap.min.js}" src="../utility/js/bootstrap.min.js"></script>
	<script th:src="@{/js/i18n.js}" src="../js/i18n.js"></script>
	<script th:src="@{/js/MembersSignUp.js}" src="../js/MembersSignUp.js"></script>

</body>
</html>
